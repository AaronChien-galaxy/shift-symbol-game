<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift 符號練習小站</title>
<meta name="description" content="給國小中年級的鍵盤符號練習：Shift、大寫字母、@、電子郵件與網址。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Shift 符號練習小站</h1>
  <p class="sub">看到藍色的 Shift，就先按住它不放，再按黃色的鍵。</p>
</header>

<!-- 登入 -->
<main id="login" class="login">
  <form id="lf">
    <h2>請輸入你的號碼</h2>
    <p>班級 3 碼＋座號 2 碼。例如三年二班 5 號，就打 <b>30205</b></p>
    <input id="sid" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="30205">
    <div class="lbtns">
      <button type="submit" id="enter">進入</button>
      <button type="button" id="guest" class="ghost">不登入，先玩玩看（不記錄）</button>
    </div>
    <p id="loginMsg" class="loginmsg"></p>
  </form>
</main>

<!-- 選單 -->
<main id="menu" class="menu" hidden>
  <div class="who" id="who"><span id="whoTxt"></span> <button id="logout" class="ghost">換人</button></div>
  <div class="grid" id="grid"></div>
  <p class="foot">進度只存在這台電腦的瀏覽器裡。要換電腦或清除，直接清掉瀏覽器資料即可。</p>
</main>

<!-- 遊戲 -->
<main id="play" class="stage" hidden>
  <div class="bar">
    <button id="back" class="ghost">← 回選單</button>
    <div class="ttl" id="ttl"></div>
    <label class="opt"><input type="checkbox" id="showhint" checked> 鍵盤提示</label>
    <label class="opt"><input type="checkbox" id="snd" checked> 音效</label>
  </div>
  <div class="count" id="count"></div>
  <div class="word" id="word"></div>
  <div class="desc" id="desc"></div>
  <div class="msg" id="msg"></div>
  <div class="caps" id="caps" hidden>大寫鎖定亮著，按一下 Caps Lock 把它關掉</div>
  <div class="kb" id="kb"></div>
  <div class="tip" id="tip"></div>
</main>

<div class="overlay" id="ov"><div class="card" id="card"></div></div>

<script src="config.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
